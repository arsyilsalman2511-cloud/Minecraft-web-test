<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Mobile & Desktop Hybrid Edition</title>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0c0f12;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Lobi Utama */
        #lobby-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #16222f 0%, #0c1015 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            color: white;
            text-shadow: 2px 2px 0px #000;
        }
        .lobby-card {
            background: rgba(20, 26, 35, 0.95);
            padding: 25px;
            border-radius: 12px;
            border: 4px solid #34495e;
            width: 360px;
            max-width: 85%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .lobby-card h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: #2ecc71;
            letter-spacing: 2px;
        }
        .lobby-card p {
            font-size: 9px;
            color: #95a5a6;
            margin: 0 0 15px 0;
        }
        .lobby-input {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            box-sizing: border-box;
            background: #0d1117;
            border: 2px solid #4f5d73;
            color: white;
            font-family: monospace;
            font-size: 12px;
            text-align: center;
            border-radius: 4px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
            font-size: 11px;
            color: #ecf0f1;
            cursor: pointer;
        }
        .checkbox-container input {
            transform: scale(1.3);
            cursor: pointer;
        }
        .lobby-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
            text-shadow: 1px 1px 0 #000;
        }
        .lobby-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
        }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }

        /* HUD & Pengaturan Atas */
        #hud-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 6px;
            border: 2px solid #444;
        }
        #hud-controls {
            position: absolute;
            top: 10px;
            left: 180px;
            z-index: 20;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .hud-btn {
            background: rgba(0,0,0,0.6);
            border: 2px solid #666;
            color: white;
            padding: 5px 10px;
            font-size: 9px;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }
        .hud-btn:active {
            background: #27ae60;
        }

        /* Tombol Aksi Blok & Interaksi Kursi / Kasur */
        #action-buttons-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-tool-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.65);
            border: 3px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 0px #000;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .action-tool-btn:active {
            transform: scale(0.95);
            background: rgba(46, 204, 113, 0.9);
        }
        #btn-break-block { border-color: #e74c3c; background: rgba(231, 76, 60, 0.4); }
        #btn-place-block { border-color: #2ecc71; background: rgba(46, 204, 113, 0.4); }
        #btn-sit { border-color: #f1c40f; background: rgba(241, 196, 15, 0.5); display: none; }
        #btn-stand { border-color: #e67e22; background: rgba(230, 126, 34, 0.6); display: none; }
        #btn-sleep { border-color: #9b59b6; background: rgba(155, 89, 182, 0.5); display: none; }
        #btn-door { border-color: #e67e22; background: rgba(230, 126, 34, 0.6); display: none; }

        /* Chatbox */
        #chat-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 260px;
            max-width: 45vw;
            height: 130px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #555;
            border-radius: 4px;
            z-index: 100;
            display: none;
            flex-direction: column;
            color: white;
            font-size: 10px;
        }
        #chat-messages {
            flex-grow: 1;
            padding: 5px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .chat-msg { word-wrap: break-word; text-shadow: 1px 1px 0 #000; }
        .chat-user { color: #3498db; font-weight: bold; }
        #chat-input-row { display: flex; border-top: 1px solid #555; }
        #chat-input {
            flex-grow: 1;
            background: #111;
            border: none;
            color: white;
            padding: 6px;
            font-size: 10px;
            font-family: monospace;
            outline: none;
        }
        #chat-send {
            background: #2ecc71;
            border: none;
            color: white;
            padding: 0 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* D-Pad Sentuh */
        #dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            z-index: 30;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
        }
        .dpad-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #888;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            touch-action: none;
        }
        .dpad-btn:active {
            background: rgba(46, 204, 113, 0.8);
            border-color: #2ecc71;
        }
        #dpad-up { grid-column: 2; grid-row: 1; }
        #dpad-left { grid-column: 1; grid-row: 2; }
        #dpad-right { grid-column: 3; grid-row: 2; }
        #dpad-down { grid-column: 2; grid-row: 3; }

        /* Tombol Lompat */
        .btn-action {
            position: absolute;
            width: 54px;
            height: 54px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #888;
            border-radius: 6px;
            color: white;
            font-size: 10px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 0px #000;
            z-index: 20;
        }
        #btn-jump { bottom: 100px; right: 105px; }

        /* Hotbar */
        #hotbar-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(80, 80, 80, 0.85);
            border: 3px solid #2c3e50;
            border-radius: 4px;
            padding: 2px;
            z-index: 20;
            max-width: 85vw;
            overflow-x: auto;
        }
        .hotbar-slot {
            width: 40px;
            height: 40px;
            background: rgba(110, 110, 110, 0.95);
            border: 2px solid #7f8c8d;
            margin: 0 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .hotbar-slot.active {
            border: 2px solid #f1c40f;
            background: rgba(150, 150, 150, 1);
        }
        .slot-color-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
        .slot-name {
            font-size: 5px;
            color: #000;
            text-align: center;
            font-weight: bold;
            margin-top: 1px;
        }

        /* Inventory Panel & Custom Block Creator */
        #inventory-panel {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            max-width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            background: #1c2530;
            border: 4px solid #2ecc71;
            border-radius: 8px;
            z-index: 250;
            color: white;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #inventory-panel h2 {
            margin-top: 0;
            text-align: center;
            color: #2ecc71;
            font-size: 15px;
            border-bottom: 2px dashed #2ecc71;
            padding-bottom: 6px;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .inv-item-card {
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 4px;
            padding: 5px;
            text-align: center;
            cursor: pointer;
        }
        .inv-item-preview {
            width: 22px;
            height: 22px;
            margin: 0 auto 3px auto;
            border-radius: 2px;
        }
        .inv-item-name { font-size: 7px; word-break: break-all; }
        
        #custom-block-creator {
            display: none;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        .pixel-editor-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 1px;
            width: 200px;
            height: 200px;
            background: #334155;
            margin: 10px auto;
            border: 2px solid #64748b;
        }
        .pixel-cell {
            width: 100%;
            height: 100%;
            background-color: #22c55e;
            cursor: pointer;
        }
        .creator-field {
            margin: 6px 0;
            text-align: left;
            font-size: 10px;
        }
        .creator-field label {
            display: block;
            margin-bottom: 2px;
            color: #94a3b8;
        }
        .creator-field input, .creator-field select {
            width: 100%;
            padding: 5px;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            font-family: monospace;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 10px;
        }
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 100%;
            padding: 7px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }

        #toast-notification {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 1000;
            display: none;
            text-align: center;
        }

        #sleep-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <div id="lobby-container">
        <div class="lobby-card">
            <h1>MINECRAFT PE HYBRID</h1>
            <p>PILIH MODE KONTROL SEBELUM BERMAIN</p>
            
            <label style="font-size: 9px; display: block; text-align: left;">NAMA KARAKTER:</label>
            <input type="text" id="username-input" class="lobby-input" value="Steve" maxlength="12">

            <label style="font-size: 9px; display: block; text-align: left; margin-top: 6px;">SEED DUNIA:</label>
            <input type="text" id="seed-input" class="lobby-input" value="999">

            <label class="checkbox-container">
                <input type="checkbox" id="mobile-mode-checkbox">
                <span>Aktifkan Mobile Mode (D-Pad & Tombol UI)</span>
            </label>

            <button id="btn-enter-game" class="lobby-btn">MASUK KE DUNIA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="crosshair"></div>
        <div id="sleep-overlay"></div>

        <div id="hud-info">
            <div><strong>MINECRAFT EDU</strong></div>
            <div id="seed-display">Seed: 999</div>
            <div id="coords-display">Posisi: X:0 Y:0 Z:0</div>
            <div id="block-focused">Membidik: -</div>
            <div id="time-display">Waktu: Pagi</div>
        </div>

        <div id="hud-controls">
            <button class="hud-btn" id="btn-inventory-toggle">INVENTORY (E)</button>
            <button class="hud-btn" id="btn-save-world">SIMPAN</button>
            <button class="hud-btn" id="btn-load-world">MUAT</button>
        </div>

        <div id="action-buttons-container">
            <button class="action-tool-btn" id="btn-break-block">HANCUR</button>
            <button class="action-tool-btn" id="btn-place-block">PASANG</button>
            <button class="action-tool-btn" id="btn-sit">DUDUK</button>
            <button class="action-tool-btn" id="btn-stand">BERDIRI</button>
            <button class="action-tool-btn" id="btn-sleep">TIDUR</button>
            <button class="action-tool-btn" id="btn-door">PINTO</button>
        </div>

        <div id="toast-notification"></div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="chat-input-row">
                <input type="text" id="chat-input" placeholder="Tekan Alt+C untuk tutup..." maxlength="50">
                <button id="chat-send">KIRIM</button>
            </div>
        </div>

        <div id="dpad-container">
            <button class="dpad-btn" id="dpad-up">▲</button>
            <button class="dpad-btn" id="dpad-left">◄</button>
            <button class="dpad-btn" id="dpad-right">►</button>
            <button class="dpad-btn" id="dpad-down">▼</button>
        </div>
        <div id="btn-jump" class="btn-action"><span>LOMPAT</span></div>

        <div id="hotbar-container"></div>

        <div id="inventory-panel">
            <h2>Inventaris & Pembuat Blok</h2>
            
            <button class="close-btn" onclick="toggleCustomBlockCreator()" style="background:#3b82f6; margin-bottom:8px;">+ BUAT BLOK BARU (16x16)</button>

            <div id="custom-block-creator">
                <div style="font-weight:bold; color:#3b82f6; font-size:11px; text-align:center;">EDITOR PIXEL BLOK 16x16</div>
                
                <div class="creator-field">
                    <label>Nama Blok Kustom:</label>
                    <input type="text" id="custom-block-name" value="Blok Kustomku" maxlength="15">
                </div>

                <div class="creator-field">
                    <label>Warna Kuas Pen:</label>
                    <input type="color" id="custom-color-picker" value="#22c55e">
                </div>

                <div class="creator-field">
                    <label>Autofill Bentuk Cepat:</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px;">
                        <button type="button" onclick="applyAutofill('top')" style="padding:4px; font-size:8px; background:#334155; color:white; border:1px solid #475569; border-radius:3px; cursor:pointer;">Setengah Atas</button>
                        <button type="button" onclick="applyAutofill('bottom')" style="padding:4px; font-size:8px; background:#334155; color:white; border:1px solid #475569; border-radius:3px; cursor:pointer;">Setengah Bawah</button>
                        <button type="button" onclick="applyAutofill('left')" style="padding:4px; font-size:8px; background:#334155; color:white; border:1px solid #475569; border-radius:3px; cursor:pointer;">Setengah Kiri</button>
                        <button type="button" onclick="applyAutofill('right')" style="padding:4px; font-size:8px; background:#334155; color:white; border:1px solid #475569; border-radius:3px; cursor:pointer;">Setengah Kanan</button>
                        <button type="button" onclick="applyAutofill('full')" style="padding:4px; font-size:8px; background:#1e3a8a; color:white; border:1px solid #3b82f6; border-radius:3px; cursor:pointer;">Penuh</button>
                        <button type="button" onclick="applyAutofill('clear')" style="padding:4px; font-size:8px; background:#7f1d1d; color:white; border:1px solid #ef4444; border-radius:3px; cursor:pointer;">Kosongkan</button>
                    </div>
                </div>

                <div class="pixel-editor-grid" id="pixel-grid"></div>

                <div class="creator-field">
                    <label>Sifat / Behavior Blok:</label>
                    <select id="custom-behavior-select" onchange="handleBehaviorChange()">
                        <option value="grass">Grass (Rumput)</option>
                        <option value="dirt">Dirt (Tanah)</option>
                        <option value="stone">Stone (Batu)</option>
                        <option value="chair">Chair (Kursi Duduk)</option>
                        <option value="bed">Bed (Tempat Tidur)</option>
                        <option value="door">Door (Pintu)</option>
                        <option value="tnt">TNT (Dinamit)</option>
                        <option value="diamond_ore">Diamond Ore (Bijih)</option>
                        <option value="liquid">Liquid (Cairan)</option>
                    </select>
                </div>

                <!-- Viscosity slider for liquid behavior -->
                <div class="creator-field" id="viscosity-container" style="display: none;">
                    <label>Viscosity (Kekentalan): <span id="viscosity-val">2</span> (Area Aliran = <span id="flow-area-val">13</span>)</label>
                    <input type="range" id="custom-viscosity-slider" min="0" max="15" value="2" step="1" oninput="updateViscosityLabel()">
                </div>

                <button class="close-btn" onclick="saveCustomBlock()" style="background:#2ecc71;">SIMPAN KE HOTBAR</button>
            </div>

            <div style="font-size:9px; color:#94a3b8; margin:8px 0 4px 0;">DAFTAR BLOK TERSEDIA:</div>
            <div class="inv-grid" id="inv-items-list"></div>

            <button class="close-btn" onclick="toggleInventory()">TUTUP (E)</button>
        </div>
    </div>

    <script>
        const minecraftBlocks = [
            { id: 1, name: "Rumput Hijau", type: "grass", color: 0x5c9e32, topColor: 0x5c9e32, sideColor: 0x866043 },
            { id: 2, name: "Tanah", type: "dirt", color: 0x866043 },
            { id: 3, name: "Batu", type: "stone", color: 0x737373 },
            { id: 4, name: "Tempat Tidur", type: "bed", color: 0xe74c3c },
            { id: 5, name: "Kursi Kayu", type: "chair", color: 0xd35400 },
            { id: 6, name: "Air Biru", type: "liquid", viscosity: 2, flowRange: 13, color: 0x2980b9, transparent: true, opacity: 0.65 },
            { id: 7, name: "Blok Redstone", type: "redstone_block", color: 0xc0392b },
            { id: 8, name: "Lampu Redstone", type: "redstone_lamp", color: 0x3e2723 },
            { id: 9, name: "TNT Dinamit", type: "tnt", color: 0xd35400 },
            { id: 10, name: "Bijih Berlian", type: "diamond_ore", color: 0x7bc6cc },
            { id: 11, name: "Pintu Kayu", type: "door", color: 0x8b4513 }
        ];

        let isMobileMode = false;
        let myUsername = "Steve";
        let numericSeed = 999;

        let scene, camera, renderer, clock;
        let blocksGroup = [];
        let voxelMap = {};
        let activeHotbarIndex = 0;
        let selectedItem = { type: 'block', id: 1 };
        const customBlocksDatabase = {};
        const mobsList = [];

        let isSitting = false;
        let isSleeping = false;
        let sitPosition = new THREE.Vector3();

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'break') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'place') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(320, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {}
        }

        let player = {
            position: new THREE.Vector3(0, 6, 0),
            velocity: new THREE.Vector3(),
            speed: 0.12,
            onGround: false,

        function checkCollision(pos) {
            const radius = 0.3;
            const minX = Math.floor(pos.x - radius);
            const maxX = Math.floor(pos.x + radius);
            const minZ = Math.floor(pos.z - radius);
            const maxZ = Math.floor(pos.z + radius);
            const minY = Math.floor(pos.y - 1.6);
            const maxY = Math.floor(pos.y + 0.2);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const block = voxelMap[`${x},${y},${z}`];
                        if (block) {
                            const data = block.userData || {};
                            // Memeriksa status pintu
                            if (data.type === 'door' || data.id === 11) {
                                // Jika pintu tertutup, anggap sebagai rintangan padat
                                if (!data.isOpen) {
                                    return true;
                                }
                            } else if (data.type === 'liquid') {
                                // Blok cairan tidak menghalangi jalan fisik pemain
                                continue;
                            } else {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        const textureCache = {};
        function createPixelTexture(baseColor, topColor, isGrass = false, customCanvas = null) {
            if (customCanvas) {
                const tex = new THREE.CanvasTexture(customCanvas);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            }

            const cacheKey = `${baseColor}_${topColor}_${isGrass}`;
            if (textureCache[cacheKey]) return textureCache[cacheKey];

            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#" + (baseColor || 0x866043).toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, 16, 16);

            for (let x = 0; x < 16; x += 2) {
                for (let y = 0; y < 16; y += 2) {
                    if (Math.random() > 0.6) {
                        ctx.fillStyle = 'rgba(0,0,0,0.12)';
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
            }

            if (isGrass && topColor) {
                ctx.fillStyle = "#" + topColor.toString(16).padStart(6, '0');
                ctx.fillRect(0, 0, 16, 5);
                for (let i = 0; i < 16; i += 2) {
                    if (Math.random() > 0.4) {
                        ctx.fillRect(i, 5, 2, 2);
                    }
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            textureCache[cacheKey] = tex;
            return tex;
        }

        function generateTerrain() {
            const size = 24;
            for (let x = -size/2; x < size/2; x++) {
                for (let z = -size/2; z < size/2; z++) {
                    const h = Math.floor(Math.sin((x + numericSeed)*0.2)*2 + Math.cos((z + numericSeed)*0.2)*2);
                    createBlockMesh(x, h, z, 1);
                    createBlockMesh(x, h-1, z, 2);
                    createBlockMesh(x, h-2, z, 3);
                }
            }
        }

        function spawnMobs() {
            for (let i = 0; i < 3; i++) {
                const mobGroup = new THREE.Group();
                const bodyGeo = new THREE.BoxGeometry(0.8, 0.6, 1.2);
                const bodyMat = new THREE.MeshLambertMaterial({ color: i % 2 === 0 ? 0xffb6c1 : 0x8b4513 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.5;
                mobGroup.add(body);

                const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const head = new THREE.Mesh(headGeo, bodyMat);
                head.position.set(0, 0.7, 0.7);
                mobGroup.add(head);

                mobGroup.position.set((Math.random() - 0.5) * 12, 4, (Math.random() - 0.5) * 12);
                scene.add(mobGroup);
                mobsList.push({ mesh: mobGroup, angle: Math.random() * Math.PI * 2, speed: 0.02 });
            }
        }

        function getBlockData(id) {
            if (customBlocksDatabase[id]) return customBlocksDatabase[id];
            return minecraftBlocks.find(b => b.id === id) || minecraftBlocks[0];
        }

        function createBlockMesh(x, y, z, id) {
            const key = `${x},${y},${z}`;
            if (voxelMap[key]) {
                removeBlockMesh(x, y, z);
            }
            const bData = getBlockData(id);
            
            if (id === 11 || bData.type === 'door') {
                const doorGroup = new THREE.Group();
                let doorMat = bData.canvas ? 
                    new THREE.MeshLambertMaterial({ map: createPixelTexture(null, null, false, bData.canvas) }) : 
                    new THREE.MeshLambertMaterial({ map: createPixelTexture(bData.color || 0x8b4513, null, false) });
                const handleMat = new THREE.MeshLambertMaterial({ color: 0xd4af37 });

                // Door Panel Mesh (Width 1, Height 2, Depth 0.25)
                // Offset mesh position relative to pivot so door rotates along one edge (hinge)
                const panelGeo = new THREE.BoxGeometry(1, 2, 0.25);
                const panelMesh = new THREE.Mesh(panelGeo, doorMat);
                panelMesh.position.set(0.5, 1, 0.125);
                doorGroup.add(panelMesh);

                // Door Knob / Handle
                const handleGeo = new THREE.BoxGeometry(0.08, 0.15, 0.35);
                const handleMesh = new THREE.Mesh(handleGeo, handleMat);
                handleMesh.position.set(0.85, 1, 0.125);
                doorGroup.add(handleMesh);

                // Set pivot container at (x - 0.5, y - 0.5, z - 0.125) so bottom rests on the surface
                doorGroup.position.set(x - 0.5, y - 0.5, z - 0.125);
                doorGroup.userData = { id: id, type: bData.type, isOpen: false, basePos: { x: x, y: y, z: z } };

                doorGroup.traverse(child => {
                    if (child.isMesh) {
                        child.userData = doorGroup.userData;
                        blocksGroup.push(child);
                    }
                });

                scene.add(doorGroup);
                voxelMap[key] = doorGroup;
                voxelMap[`${x},${y+1},${z}`] = doorGroup;
                return;
            }

            if (id === 5 || bData.type === 'chair') {
                const chairGroup = new THREE.Group();
                let mat = bData.canvas ? new THREE.MeshLambertMaterial({ map: createPixelTexture(null, null, false, bData.canvas) }) : new THREE.MeshLambertMaterial({ map: createPixelTexture(bData.color || 0xd35400, null, false) });

                const seatGeo = new THREE.BoxGeometry(0.8, 0.15, 0.8);
                const seat = new THREE.Mesh(seatGeo, mat);
                seat.position.y = 0.3;
                chairGroup.add(seat);

                const backGeo = new THREE.BoxGeometry(0.8, 0.7, 0.12);
                const back = new THREE.Mesh(backGeo, mat);
                back.position.set(0, 0.7, -0.34);
                chairGroup.add(back);

                const legGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
                [[-0.32, 0, -0.32], [0.32, 0, -0.32], [-0.32, 0, 0.32], [0.32, 0, 0.32]].forEach(p => {
                    const leg = new THREE.Mesh(legGeo, mat);
                    leg.position.set(p[0], 0.05, p[2]);
                    chairGroup.add(leg);
                });

                chairGroup.position.set(x, y, z);
                chairGroup.userData = { id: id, type: bData.type };
                chairGroup.traverse(child => { if (child.isMesh) { child.userData = chairGroup.userData; blocksGroup.push(child); } });
                scene.add(chairGroup);
                voxelMap[key] = chairGroup;
                return;
            }

            if (id === 4 || bData.type === 'bed') {
                const bedGroup = new THREE.Group();
                let bedMat = bData.canvas ? new THREE.MeshLambertMaterial({ map: createPixelTexture(null, null, false, bData.canvas) }) : new THREE.MeshLambertMaterial({ map: createPixelTexture(bData.color || 0xe74c3c, null, false) });
                const whiteMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0xffffff, null, false) });
                const woodMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x866043, null, false) });

                const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 0.9), bedMat);
                headMesh.position.set(0, 0.2, 0);
                bedGroup.add(headMesh);

                const pillowMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.35), whiteMat);
                pillowMesh.position.set(0, 0.4, -0.25);
                bedGroup.add(pillowMesh);

                const footMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 0.9), bedMat);
                footMesh.position.set(0, 0.2, 1.0);
                bedGroup.add(footMesh);

                const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.1, 1.95), woodMat);
                frameMesh.position.set(0, 0.05, 0.5);
                bedGroup.add(frameMesh);

                bedGroup.position.set(x, y, z);
                bedGroup.userData = { id: id, type: bData.type };
                bedGroup.traverse(child => { if (child.isMesh) { child.userData = bedGroup.userData; blocksGroup.push(child); } });
                scene.add(bedGroup);
                voxelMap[key] = bedGroup;
                voxelMap[`${x},${y},${z+1}`] = bedGroup;
                return;
            }

            let material;
            if (bData.canvas) {
                material = new THREE.MeshLambertMaterial({ 
                    map: createPixelTexture(null, null, false, bData.canvas),
                    transparent: bData.transparent || false,
                    opacity: bData.opacity || 1.0
                });
            } else if (bData.type === 'grass') {
                const sideTex = createPixelTexture(0x866043, 0x5c9e32, true);
                const topTex = createPixelTexture(0x5c9e32, null, false);
                const bottomTex = createPixelTexture(0x866043, null, false);
                material = [
                    new THREE.MeshLambertMaterial({ map: sideTex }),
                    new THREE.MeshLambertMaterial({ map: sideTex }),
                    new THREE.MeshLambertMaterial({ map: topTex }),
                    new THREE.MeshLambertMaterial({ map: bottomTex }),
                    new THREE.MeshLambertMaterial({ map: sideTex }),
                    new THREE.MeshLambertMaterial({ map: sideTex })
                ];
            } else {
                material = new THREE.MeshLambertMaterial({
                    map: createPixelTexture(bData.color),
                    transparent: bData.transparent || false,
                    opacity: bData.opacity || 1.0
                });
            }

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
            mesh.position.set(x, y, z);
            mesh.userData = { id: id, type: bData.type, viscosity: bData.viscosity, flowRange: bData.flowRange };
            scene.add(mesh);
            blocksGroup.push(mesh);
            voxelMap[key] = mesh;
        }

        let currentPixelColor = "#22c55e";
        let pixelCanvasContext = null;

        function initPixelEditor() {
            const grid = document.getElementById('pixel-grid');
            grid.innerHTML = '';

            const offCanvas = document.createElement('canvas');
            offCanvas.width = 16;
            offCanvas.height = 16;
            pixelCanvasContext = offCanvas.getContext('2d');
            pixelCanvasContext.fillStyle = currentPixelColor;
            pixelCanvasContext.fillRect(0, 0, 16, 16);

            for (let i = 0; i < 256; i++) {
                const cell = document.createElement('div');
                cell.className = 'pixel-cell';
                cell.style.backgroundColor = currentPixelColor;

                cell.addEventListener('pointerdown', () => {
                    currentPixelColor = document.getElementById('custom-color-picker').value;
                    cell.style.backgroundColor = currentPixelColor;
                    const x = i % 16;
                    const y = Math.floor(i / 16);
                    pixelCanvasContext.fillStyle = currentPixelColor;
                    pixelCanvasContext.fillRect(x, y, 1, 1);
                });
                grid.appendChild(cell);
            }
        }

        function applyAutofill(shape) {
            const color = document.getElementById('custom-color-picker').value;
            const gridCells = document.querySelectorAll('.pixel-cell');
            
            for (let y = 0; y < 16; y++) {
                for (let x = 0; x < 16; x++) {
                    let fill = false;
                    if (shape === 'top' && y < 8) fill = true;
                    if (shape === 'bottom' && y >= 8) fill = true;
                    if (shape === 'left' && x < 8) fill = true;
                    if (shape === 'right' && x >= 8) fill = true;
                    if (shape === 'full') fill = true;
                    if (shape === 'clear') fill = false;
                    
                    if (shape === 'clear' || fill) {
                        const cellColor = shape === 'clear' ? '#22c55e' : color;
                        const index = y * 16 + x;
                        if (gridCells[index]) {
                            gridCells[index].style.backgroundColor = cellColor;
                        }
                        pixelCanvasContext.fillStyle = cellColor;
                        pixelCanvasContext.fillRect(x, y, 1, 1);
                    }
                }
            }
            showToast(`Autofill ${shape} berhasil diterapkan!`);
        }

        function saveCustomBlock() {
            const name = document.getElementById('custom-block-name').value.trim() || "Blok Kustom";
            const behavior = document.getElementById('custom-behavior-select').value;
            const viscosity = behavior === 'liquid' ? parseInt(document.getElementById('custom-viscosity-slider').value) : 0;

        function toggleDoor(doorGroup) {
            if (!doorGroup) return;
            const data = doorGroup.userData;
            data.isOpen = !data.isOpen;

            // Rotate 90 degrees around Y axis hinge when open
            if (data.isOpen) {
                doorGroup.rotation.y = Math.PI / 2;
                playSound('place');
                showToast("Pintu dibuka!");
            } else {
                doorGroup.rotation.y = 0;
                playSound('place');
                showToast("Pintu ditutup!");
            }
        }

        function goToSleep() {
            if (isSleeping) return;
            isSleeping = true;
            if (!isMobileMode) document.exitPointerLock();
            
            const overlay = document.getElementById('sleep-overlay');
            overlay.style.opacity = '1';
            showToast("Sedang tidur... Layar menggelap selama 2 detik...");

            setTimeout(() => {
                gameTime = Math.PI / 2;
                overlay.style.opacity = '0';

                    if (!isMobileMode && !isSitting) {
                        renderer.domElement.requestPointerLock().catch(() => {});

                    showToast("Selamat pagi! Waktu diset ke pagi hari.");

            }, 2000);

        function sitOnChair(pos) {
            isSitting = true;
            sitPosition.copy(pos);
            sitPosition.y += 0.8;
            player.position.copy(sitPosition);
            player.velocity.set(0, 0, 0);
            document.getElementById('btn-sit').style.display = 'none';
            document.getElementById('btn-stand').style.display = 'flex';

            showToast("Berhasil duduk di kursi!");

        function standUp() {
            if (!isSitting) return;
            isSitting = false;
            
            const forwardOffset = new THREE.Vector3(0, 0, -1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            player.position.add(forwardOffset);
            player.position.y += 1.2; 
            
            player.velocity.y = 0.18;
            player.onGround = false;
            playSound('jump');
            
            keysPressed.w = false;
            keysPressed.s = false;
            keysPressed.a = false;
            keysPressed.d = false;
            keysPressed.shift = false;
            dpadState.up = false;
            dpadState.down = false;
            dpadState.left = false;
            dpadState.right = false;

            document.getElementById('btn-sit').style.display = 'flex';
            document.getElementById('btn-stand').style.display = 'none';
            if (!isMobileMode) renderer.domElement.requestPointerLock().catch(() => {});
            showToast("Berdiri dan melompat dari kursi!");
        }

        function setupInputListeners() {
            window.addEventListener('keydown', (e) => {
                if (e.altKey && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    toggleChatBox();
                    return;
                }

                if (e.key === 'Shift') {
                    keysPressed.shift = true;
                }

                if (e.shiftKey && e.key.toLowerCase() === 't' && isSitting) {
                    standUp();
                    return;
                }

                if (e.key >= '1' && e.key <= '9') {
                    const slotIndex = parseInt(e.key) - 1;
                    if (slotIndex < hotbarSelection.length) {
                        activeHotbarIndex = slotIndex;
                        selectedItem = hotbarSelection[activeHotbarIndex];
                        buildHotbarUI();
                    }
                    return;
                }

                if (isChatOpen || isInventoryOpen) return;

                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'arrowup') keysPressed.w = true;
                if (k === 's' || k === 'arrowdown') keysPressed.s = true;
                if (k === 'a' || k === 'arrowleft') keysPressed.a = true;
                if (k === 'd' || k === 'arrowright') keysPressed.d = true;
                if (e.code === 'Space') jump();
                if (k === 'e') {
                    e.preventDefault();
                    toggleInventory();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'Shift') {
                    keysPressed.shift = false;
                }
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'arrowup') keysPressed.w = false;
                if (k === 's' || k === 'arrowdown') keysPressed.s = false;
                if (k === 'a' || k === 'arrowleft') keysPressed.a = false;
                if (k === 'd' || k === 'arrowright') keysPressed.d = false;
            });

            if (!isMobileMode) {
                renderer.domElement.addEventListener('click', () => {
                    if (!isInventoryOpen && !isChatOpen) {
                        renderer.domElement.requestPointerLock().catch(() => {});
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (document.pointerLockElement === renderer.domElement && !isInventoryOpen && !isChatOpen) {
                        player.rotation.y -= e.movementX * 0.003;
                        player.rotation.x -= e.movementY * 0.003;
                        player.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.rotation.x));
                    }
                });
            }

            function performBreakBlock() {
                if (isInventoryOpen || isChatOpen) return;
                const target = targetedBlockInfo || lastValidTargetInfo;
                if (target && target.mesh) {
                    const mesh = target.mesh;
                    const parentRoot = mesh.parent && mesh.parent.isGroup ? mesh.parent : mesh;
                    let px, py, pz;
                    if (parentRoot.userData && parentRoot.userData.basePos) {
                        px = parentRoot.userData.basePos.x;
                        py = parentRoot.userData.basePos.y;
                        pz = parentRoot.userData.basePos.z;
                    } else {
                        const worldPos = new THREE.Vector3();
                        parentRoot.getWorldPosition(worldPos);
                        px = Math.round(worldPos.x);
                        py = Math.round(worldPos.y);
                        pz = Math.round(worldPos.z);
                    }
                    removeBlockMesh(px, py, pz);
                    playSound('break');
                    showToast("Blok/Kursi/Kasur/Pintu Berhasil Dihancurkan!");
                    targetedBlockInfo = null;
                    lastValidTargetInfo = null;
                    highlightBox.visible = false;
                } else {
                    showToast("Tidak ada blok yang dibidik!");
                }
            }

            function performPlaceBlock() {
                if (isInventoryOpen || isChatOpen) return;
                const target = targetedBlockInfo || lastValidTargetInfo;
                if (target && target.mesh) {
                    const normal = target.face.normal;
                    const mesh = target.mesh;
                    const parentRoot = mesh.parent && mesh.parent.isGroup ? mesh.parent : mesh;
                    let px, py, pz;
                    if (parentRoot.userData && parentRoot.userData.basePos) {
                        px = parentRoot.userData.basePos.x;
                        py = parentRoot.userData.basePos.y;
                        pz = parentRoot.userData.basePos.z;
                    } else {
                        const worldPos = new THREE.Vector3();
                        parentRoot.getWorldPosition(worldPos);
                        px = Math.round(worldPos.x);
                        py = Math.round(worldPos.y);
                        pz = Math.round(worldPos.z);
                    }
                    createBlockMesh(px + normal.x, py + normal.y, pz + normal.z, selectedItem.id);
                    playSound('place');
                    showToast("Blok Dipasang!");
                } else {
                    showToast("Arahkan bidikan ke blok!");
                }
            }

            renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
            renderer.domElement.addEventListener('click', (e) => {
                if (isInventoryOpen || isChatOpen) return;
                if (e.button === 0) {
                    if (keysPressed.shift && targetedBlockInfo && targetedBlockInfo.mesh) {
                        const bId = targetedBlockInfo.mesh.userData.id;
                        const bData = getBlockData(bId);
                        const parentRoot = targetedBlockInfo.mesh.parent && targetedBlockInfo.mesh.parent.isGroup ? targetedBlockInfo.mesh.parent : targetedBlockInfo.mesh;
                        const groupPos = new THREE.Vector3();
                        parentRoot.getWorldPosition(groupPos);

                        if (bId === 5 || bData.type === 'chair') {
                            sitOnChair(groupPos);
                            return;
                        }
                        if (bId === 4 || bData.type === 'bed') {
                            goToSleep();
                            return;
                        }
                        if (bId === 11 || bData.type === 'door') {
                            toggleDoor(parentRoot);
                            return;
                        }
                    }
                    performBreakBlock();
                }
            });

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (isInventoryOpen || isChatOpen) return;
                if (e.button === 2) {
                    e.preventDefault();
                    performPlaceBlock();
                }
            });

            document.getElementById('btn-break-block').addEventListener('click', (e) => { e.stopPropagation(); performBreakBlock(); });
            document.getElementById('btn-place-block').addEventListener('click', (e) => { e.stopPropagation(); performPlaceBlock(); });
            
            document.getElementById('btn-sit').addEventListener('click', (e) => {
                e.stopPropagation();
                const target = targetedBlockInfo || lastValidTargetInfo;
                if (target && target.mesh) {
                    const bId = target.mesh.userData.id;
                    const bData = getBlockData(bId);
                    const parentRoot = target.mesh.parent && target.mesh.parent.isGroup ? target.mesh.parent : target.mesh;
                    const groupPos = new THREE.Vector3();
                    parentRoot.getWorldPosition(groupPos);

                    if (bId === 5 || bData.type === 'chair') {
                        sitOnChair(groupPos);
                    } else {
                        showToast("Bukan kursi kayu!");
                    }
                }
            });

            document.getElementById('btn-door').addEventListener('click', (e) => {
                e.stopPropagation();
                const target = targetedBlockInfo || lastValidTargetInfo;
                if (target && target.mesh) {
                    const bId = target.mesh.userData.id;
                    const bData = getBlockData(bId);
                    const parentRoot = target.mesh.parent && target.mesh.parent.isGroup ? target.mesh.parent : target.mesh;

                    if (bId === 11 || bData.type === 'door') {
                        toggleDoor(parentRoot);
                    } else {
                        showToast("Bukan pintu kayu!");
                    }
                }
            });

            document.getElementById('btn-stand').addEventListener('click', (e) => { e.stopPropagation(); standUp(); });

            const bindDpad = (id, key) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); dpadState[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); dpadState[key] = false; });
                el.addEventListener('mousedown', () => { dpadState[key] = true; });
                el.addEventListener('mouseup', () => { dpadState[key] = false; });
            };
            bindDpad('dpad-up', 'up');
            bindDpad('dpad-down', 'down');
            bindDpad('dpad-left', 'left');
            bindDpad('dpad-right', 'right');

            document.getElementById('btn-jump').addEventListener('click', jump);
            document.getElementById('btn-inventory-toggle').addEventListener('click', toggleInventory);

            document.getElementById('btn-save-world').addEventListener('click', () => {
                const saveData = [];
                for (const key in voxelMap) {
                    saveData.push({ pos: key, id: voxelMap[key].userData.id });
                }
                localStorage.setItem('minecraft_pe_save', JSON.stringify(saveData));
                showToast("Dunia berhasil disimpan!");
            });

            document.getElementById('btn-load-world').addEventListener('click', () => {
                const raw = localStorage.getItem('minecraft_pe_save');
                if (!raw) {
                    showToast("Tidak ada data simpanan ditemukan!");
                    return;
                }
                try {
                    const saveData = JSON.parse(raw);
                    for (const key in voxelMap) {
                        const obj = voxelMap[key];
                        scene.remove(obj);
                        if (obj.isGroup) obj.traverse(child => { if (child.geometry) child.geometry.dispose(); });
                    }
                    blocksGroup = [];
                    voxelMap = {};
                    saveData.forEach(item => {
                        const coords = item.pos.split(',').map(Number);
                        createBlockMesh(coords[0], coords[1], coords[2], item.id);
                    });
                    showToast("Dunia berhasil dimuat!");
                } catch(err) {
                    showToast("Gagal memuat dunia!");
                }
            });
        }

        function removeBlockMesh(x, y, z) {
            const key = `${x},${y},${z}`;
            let targetObj = voxelMap[key];
            
            if (!targetObj) {
                for (let k in voxelMap) {
                    const pos = k.split(',').map(Number);
                    if (pos[0] === x && pos[1] === y && pos[2] === z) {
                        targetObj = voxelMap[k];
                        break;
                    }
                }
            }

            if (targetObj) {
                for (let k in voxelMap) {
                    if (voxelMap[k] === targetObj) {
                        delete voxelMap[k];
                    }
                }
                scene.remove(targetObj);
                if (targetObj.isGroup) {
                    targetObj.traverse(child => {
                        blocksGroup = blocksGroup.filter(b => b !== child);
                        if (child.geometry) child.geometry.dispose();
                    });
                } else {
                    blocksGroup = blocksGroup.filter(b => b !== targetObj);
                    if (targetObj.geometry) targetObj.geometry.dispose();
                }
            }
        }

        function jump() {
            if (player.onGround && !isInventoryOpen && !isChatOpen && !isSitting) {
                player.velocity.y = 0.18;
                player.onGround = false;
                playSound('jump');
            }
        }

        function toggleInventory() {
            isInventoryOpen = !isInventoryOpen;
            const panel = document.getElementById('inventory-panel');
            panel.style.display = isInventoryOpen ? 'block' : 'none';
            if (isInventoryOpen) {
                if (!isMobileMode) document.exitPointerLock();
            } else {
                if (!isMobileMode && !isSitting) renderer.domElement.requestPointerLock().catch(() => {});
            }
        }

        function toggleChatBox() {
            isChatOpen = !isChatOpen;
            const chat = document.getElementById('chat-container');
            chat.style.display = isChatOpen ? 'flex' : 'none';
            if (isChatOpen) {
                if (!isMobileMode) document.exitPointerLock();
                document.getElementById('chat-input').focus();
            } else {
                if (!isMobileMode && !isSitting) renderer.domElement.requestPointerLock().catch(() => {});
            }
        }

        document.getElementById('chat-send').addEventListener('click', () => {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (txt) {
                const box = document.getElementById('chat-messages');
                box.innerHTML += `<div class="chat-msg"><span class="chat-user">${myUsername}:</span> ${txt}</div>`;
                box.scrollTop = box.scrollHeight;
                input.value = '';
            }
            toggleChatBox();
        });

        function buildHotbarUI() {
            const container = document.getElementById('hotbar-container');
            container.innerHTML = '';
            hotbarSelection.forEach((slot, idx) => {
                const b = getBlockData(slot.id);
                const div = document.createElement('div');
                div.className = `hotbar-slot ${idx === activeHotbarIndex ? 'active' : ''}`;
                div.innerHTML = `<div class="slot-color-box" style="background:#${(b.color || 0x2ecc71).toString(16).padStart(6,'0')}"></div><div class="slot-name">${b.name.substring(0,7)}</div>`;
                div.onclick = () => { activeHotbarIndex = idx; selectedItem = slot; buildHotbarUI(); };
                container.appendChild(div);
            });
        }

        function buildInventoryUI() {
            const grid = document.getElementById('inv-items-list');
            grid.innerHTML = '';
            [...minecraftBlocks, ...Object.values(customBlocksDatabase)].forEach(b => {
                const card = document.createElement('div');
                card.className = 'inv-item-card';
                card.innerHTML = `<div class="inv-item-preview" style="background:#${(b.color || 0x2ecc71).toString(16).padStart(6,'0')}"></div><div class="inv-item-name">${b.name}</div>`;
                card.onclick = () => {
                    hotbarSelection[activeHotbarIndex] = { type: 'block', id: b.id };
                    selectedItem = hotbarSelection[activeHotbarIndex];
                    buildHotbarUI();
                    toggleInventory();
                };
                grid.appendChild(card);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            gameTime += 0.0005;
            const cycle = Math.sin(gameTime);
            let skyColor, timeStr;
            if (cycle > 0.2) {
                skyColor = new THREE.Color(0x87ceeb);
                timeStr = "Pagi / Siang";
            } else if (cycle < -0.2) {
                skyColor = new THREE.Color(0x0c141f);
                timeStr = "Malam";
            } else {
                skyColor = new THREE.Color(0xd97757);
                timeStr = "Sore / Senja";
            }
            scene.background.lerp(skyColor, 0.05);
            scene.fog.color.lerp(skyColor, 0.05);
            document.getElementById('time-display').innerText = `Waktu: ${timeStr}`;

            mobsList.forEach(mob => {
                mob.angle += 0.01;
                mob.mesh.position.x += Math.cos(mob.angle) * mob.speed;
                mob.mesh.position.z += Math.sin(mob.angle) * mob.speed;
                mob.mesh.rotation.y = -mob.angle;
            });

            if (!isInventoryOpen && !isChatOpen && !isSleeping) {
                const dirX = Math.cos(player.rotation.x) * Math.sin(player.rotation.y);
                const dirY = Math.sin(player.rotation.x);
                const dirZ = Math.cos(player.rotation.x) * Math.cos(player.rotation.y);
                camera.lookAt(player.position.clone().add(new THREE.Vector3(dirX, dirY, dirZ)));

                if (isSitting) {
                    player.position.copy(sitPosition);
                } else {
                    let forward = 0, side = 0;
                    if (keysPressed.w || dpadState.up) forward += player.speed;
                    if (keysPressed.s || dpadState.down) forward -= player.speed;
                    if (keysPressed.a || dpadState.left) side -= player.speed;
                    if (keysPressed.d || dpadState.right) side += player.speed;

                    if (forward !== 0 || side !== 0) {
                        const fVec = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y)).multiplyScalar(forward);
                        const sVec = new THREE.Vector3(-Math.cos(player.rotation.y), 0, Math.sin(player.rotation.y)).multiplyScalar(side);

                        player.position.x += fVec.x + sVec.x;
                        if (checkCollision(player.position)) player.position.x -= (fVec.x + sVec.x);
                        player.position.z += fVec.z + sVec.z;
                        if (checkCollision(player.position)) player.position.z -= (fVec.z + sVec.z);
                    }

                    player.velocity.y -= 0.008;
                    player.position.y += player.velocity.y;

                    player.onGround = false;
                    if (checkCollision(player.position)) {
                        if (player.velocity.y < 0) {
                            player.position.y -= player.velocity.y;
                            player.position.y = Math.floor(player.position.y - 1.6) + 1.6 + 0.001;
                            player.velocity.y = 0;
                            player.onGround = true;
                        } else if (player.velocity.y > 0) {
                            player.position.y -= player.velocity.y;
                            player.velocity.y = 0;
                        }
                    }

                    if (player.position.y < -25) {
                        player.position.set(0, 10, 0);
                        player.velocity.set(0, 0, 0);
                    }
                }

                camera.position.copy(player.position);
            }

            raycaster.setFromCamera(mouseCenter, camera);
            const intersects = raycaster.intersectObjects(blocksGroup, false);
            if (intersects.length > 0) {
                targetedBlockInfo = intersects[0];
                if (targetedBlockInfo && targetedBlockInfo.object) {
                    targetedBlockInfo.mesh = targetedBlockInfo.object;
                    lastValidTargetInfo = targetedBlockInfo;
                    
                    const parentRoot = targetedBlockInfo.mesh.parent && targetedBlockInfo.mesh.parent.isGroup ? targetedBlockInfo.mesh.parent : targetedBlockInfo.mesh;
                    const highlightPos = new THREE.Vector3();
                    parentRoot.getWorldPosition(highlightPos);
                    highlightBox.position.copy(highlightPos);
                    highlightBox.visible = true;
                    
                    const bId = targetedBlockInfo.mesh.userData.id;
                    const bData = getBlockData(bId);
                    document.getElementById('block-focused').innerText = `Membidik: ${bData ? bData.name : bId}`;

                    if (bId === 5 || bData.type === 'chair') {
                        document.getElementById('btn-sit').style.display = isSitting ? 'none' : 'flex';
                        document.getElementById('btn-sleep').style.display = 'none';
                        document.getElementById('btn-door').style.display = 'none';
                    } else if (bId === 4 || bData.type === 'bed') {
                        document.getElementById('btn-sleep').style.display = 'flex';
                        document.getElementById('btn-sit').style.display = 'none';
                        document.getElementById('btn-door').style.display = 'none';
                    } else if (bId === 11 || bData.type === 'door') {
                        document.getElementById('btn-door').style.display = 'flex';
                        document.getElementById('btn-sit').style.display = 'none';
                        document.getElementById('btn-sleep').style.display = 'none';
                    } else {
                        document.getElementById('btn-sit').style.display = 'none';
                        document.getElementById('btn-sleep').style.display = 'none';
                        document.getElementById('btn-door').style.display = 'none';
                    }
                }
            } else {
                targetedBlockInfo = null;
                highlightBox.visible = false;
                document.getElementById('block-focused').innerText = `Membidik: -`;
                document.getElementById('btn-sit').style.display = 'none';
                document.getElementById('btn-sleep').style.display = 'none';
                document.getElementById('btn-door').style.display = 'none';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
